<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="HTML Visualizer - Preview, save, and organize your HTML snippets">
    <title>HTML Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Mobile Header -->
        <header class="mobile-header" id="mobileHeader">
            <button class="btn-icon" id="menuBtn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
            </button>
            <h1 class="mobile-title">
                <span class="logo-icon">&lt;/&gt;</span>
                <span id="mobileTitleText">HTML Visualizer</span>
            </h1>
            <button class="btn-icon" id="mobilePreviewBtn" aria-label="Preview">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </button>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">
                    <span class="logo-icon">&lt;/&gt;</span>
                    <span class="logo-text">HTML Visualizer</span>
                </h1>
                <button class="btn-icon sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Search & Filter -->
            <div class="search-section">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search snippets...">
                </div>
                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                    <option value="component">Components</option>
                    <option value="layout">Layouts</option>
                    <option value="animation">Animations</option>
                    <option value="form">Forms</option>
                    <option value="game">Games</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Actions -->
            <div class="sidebar-actions">
                <div class="action-row">
                    <button class="btn btn-secondary btn-small flex-1" id="exportBtn" title="Export all snippets">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export
                    </button>
                    <button class="btn btn-secondary btn-small flex-1" id="importBtn" title="Import snippets">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Import
                    </button>
                    <input type="file" id="importFile" accept=".json" hidden>
                </div>
            </div>

            <!-- Snippets List -->
            <div class="snippets-section">
                <div class="snippets-header">
                    <span class="snippets-count" id="snippetsCount">0 snippets</span>
                    <span class="auto-save-indicator" id="autoSaveIndicator">
                        <span class="auto-save-dot"></span>
                        Auto-save
                    </span>
                </div>
                <div class="snippets-list" id="snippetsList">
                    <div class="empty-state" id="emptyState">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <p>No snippets yet</p>
                        <span>Paste HTML to auto-save</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <input type="text" id="currentTitle" class="title-input" placeholder="Untitled" value="" readonly>
                    <span class="status-indicator" id="statusIndicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Ready</span>
                    </span>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-primary" id="openNewTabBtn" title="Open in new tab">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        <span>Open</span>
                    </button>
                    <button class="btn btn-ghost" id="downloadBtn" title="Download HTML">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                    <button class="btn btn-ghost" id="saveFolderBtn" title="Save to folder">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Editor & Preview -->
            <div class="editor-container" id="editorContainer">
                <div class="editor-panel" id="editorPanel">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            Editor
                        </span>
                        <div class="editor-stats">
                            <span id="lineCount">0</span>
                            <span id="charCount">0</span>
                        </div>
                    </div>
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="lineNumbers"></div>
                        <textarea id="htmlEditor" class="html-editor" placeholder="Paste your HTML code here..." spellcheck="false"></textarea>
                    </div>
                </div>

                <div class="resizer" id="resizer"></div>

                <div class="preview-panel" id="previewPanel">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            Preview
                        </span>
                        <div class="preview-actions">
                            <button class="btn-icon" id="refreshPreview" title="Refresh">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="preview-wrapper">
                        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
                    </div>
                </div>
            </div>

            <!-- Mobile View Toggle -->
            <div class="mobile-view-toggle" id="mobileViewToggle">
                <button class="toggle-btn active" data-view="editor">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"/>
                        <polyline points="8 6 2 12 8 18"/>
                    </svg>
                    Code
                </button>
                <button class="toggle-btn" data-view="preview">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                    Preview
                </button>
                <button class="toggle-btn" data-view="split">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="12" y1="3" x2="12" y2="21"/>
                    </svg>
                    Split
                </button>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
